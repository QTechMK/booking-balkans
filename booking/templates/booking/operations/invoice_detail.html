{% extends 'booking/operations/_shell.html' %}
{% block operations_content %}<section class="card"><div class="card-header d-flex justify-content-between"><strong>Fatura detayı · {{ invoice.number }}</strong><a class="btn btn-sm btn-outline-secondary" href="{% url 'operations:invoice_preview' invoice.id %}?property_id={{ selected_property.id }}">PDF/önizleme</a></div><div class="card-body"><form method="post">{% csrf_token %}<input type="hidden" name="property_id" value="{{ selected_property.id }}"><div class="row g-3">{% for field in form %}<div class="col-md-6"><label class="form-label">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}</div><button class="btn btn-primary mt-3">Faturayı kaydet</button></form></div></section>{% endblock operations_content %}
