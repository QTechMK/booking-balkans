{% extends 'booking/operations/_shell.html' %}{% block operations_content %}<div class="card border shadow-sm"><div class="card-header bg-transparent"><h2 class="h5 mb-0">Online Booking Ayarları</h2></div><div class="card-body"><form method="post">{% csrf_token %}<input type="hidden" name="property_id" value="{{ selected_property.id }}"><div class="row g-3"><div class="col-md-4"><label class="form-check form-switch"><input class="form-check-input" type="checkbox" name="booking_page_active" {% if settings.booking_page_active %}checked{% endif %}><span class="form-check-label">Booking sayfası aktif</span></label></div><div class="col-md-4"><label class="form-check form-switch"><input class="form-check-input" type="checkbox" name="online_checkin_active" {% if settings.online_checkin_active %}checked{% endif %}><span class="form-check-label">Online check-in</span></label></div><div class="col-md-4"><label class="form-check form-switch"><input class="form-check-input" type="checkbox" name="online_payment_active" {% if settings.online_payment_active %}checked{% endif %}><span class="form-check-label">Online ödeme</span></label></div><div class="col-md-4"><label class="form-check form-switch"><input class="form-check-input" type="checkbox" name="deposit_payment_active" {% if settings.deposit_payment_active %}checked{% endif %}><span class="form-check-label">Depozito ödeme</span></label></div><div class="col-md-4"><label class="form-check form-switch"><input class="form-check-input" type="checkbox" name="extra_services_active" {% if settings.extra_services_active %}checked{% endif %}><span class="form-check-label">Ek hizmetler</span></label></div><div class="col-md-4"><label class="form-check form-switch"><input class="form-check-input" type="checkbox" name="room_upgrade_active" {% if settings.room_upgrade_active %}checked{% endif %}><span class="form-check-label">Oda yükseltme</span></label></div><div class="col-md-4"><label class="form-check form-switch"><input class="form-check-input" type="checkbox" name="late_checkout_active" {% if settings.late_checkout_active %}checked{% endif %}><span class="form-check-label">Geç çıkış</span></label></div><div class="col-md-4"><label class="form-check form-switch"><input class="form-check-input" type="checkbox" name="transfer_active" {% if settings.transfer_active %}checked{% endif %}><span class="form-check-label">Transfer</span></label></div><div class="col-md-4"><label class="form-check form-switch"><input class="form-check-input" type="checkbox" name="guest_portal_active" {% if settings.guest_portal_active %}checked{% endif %}><span class="form-check-label">Misafir portalı</span></label></div><div class="col-md-6"><label class="form-label">SEO başlığı</label><input name="seo_title" class="form-control" value="{{ settings.seo_title }}"></div><div class="col-md-6"><label class="form-label">Domain</label><input name="domain" class="form-control" value="{{ settings.domain }}"></div><div class="col-12"><label class="form-label">SEO açıklaması</label><textarea name="seo_description" class="form-control">{{ settings.seo_description }}</textarea></div><div class="col-12"><label class="form-label">Meta keywords</label><input name="meta_keywords" class="form-control" value="{{ settings.meta_keywords }}"></div></div><button class="btn btn-primary mt-4">Ayarları kaydet</button></form></div></div>{% endblock operations_content %}
