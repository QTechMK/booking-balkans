{% extends 'booking/admin_base.html' %}
{% block content %}
<main class="hotel-erp-page">
  <div class="hotel-erp-toolbar">
    <div class="hotel-erp-heading"><span class="hotel-erp-kicker">HOTEL MANAGER</span><h1>{{ title }}</h1></div>
    <form method="get" class="hotel-erp-property"><label for="property_id">Tesis</label><select class="form-select form-select-sm" id="property_id" name="property_id" onchange="this.submit()">{% for property in properties %}<option value="{{ property.id }}" {% if selected_property.id == property.id %}selected{% endif %}>{{ property.name }}</option>{% endfor %}</select></form>
  </div>
  <nav class="hotel-erp-tabs" aria-label="Hotel manager screens">
    <a class="{% if request.resolver_match.url_name == 'room_rack' %}is-active{% endif %}" href="{% url 'operations:room_rack' %}"><i class="fa fa-bed"></i> Room Rack</a>
    <a class="{% if request.resolver_match.url_name == 'housekeeping' %}is-active{% endif %}" href="{% url 'operations:housekeeping' %}"><i class="fa fa-broom"></i> Housekeeping</a>
    <a class="{% if request.resolver_match.url_name == 'tasks' %}is-active{% endif %}" href="{% url 'operations:tasks' %}"><i class="fa fa-tasks"></i> Görevler</a>
    <a class="{% if request.resolver_match.url_name == 'maintenance' %}is-active{% endif %}" href="{% url 'operations:maintenance' %}"><i class="fa fa-wrench"></i> Teknik Servis</a>
    <a class="{% if request.resolver_match.url_name == 'access_control' %}is-active{% endif %}" href="{% url 'operations:access_control' %}"><i class="fa fa-users"></i> Kullanıcılar</a>
    <a class="hotel-erp-refresh" href="javascript:location.reload()"><i class="fa fa-refresh"></i> Yenile</a>
  </nav>
  <section class="hotel-erp-content">{% block operations_content %}{% endblock %}</section>
</main>
{% endblock content %}
