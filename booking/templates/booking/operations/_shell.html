{% extends 'base.html' %}
{% block content %}
{% include 'partials/navbar.html' %}
<main class="py-4">
  <div class="container-fluid px-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
      <div><h1 class="h3 mb-1">{{ title }}</h1><p class="text-body-secondary mb-0">Hotel operasyon yönetimi</p></div>
      <form method="get" class="d-flex gap-2"><select class="form-select" name="property_id" onchange="this.form.submit()">{% for property in properties %}<option value="{{ property.id }}" {% if selected_property.id == property.id %}selected{% endif %}>{{ property.name }}</option>{% endfor %}</select></form>
    </div>
    <div class="card border shadow-sm mb-3"><div class="card-body py-2"><div class="d-flex flex-wrap gap-2 align-items-center"><span class="text-primary fw-semibold">⋮</span><span class="border-start ps-3">Yeni kayıt</span><span class="border-start ps-3">Düzenle</span><span class="border-start ps-3">Yazdır</span><span class="border-start ps-3">Yenile</span></div></div></div>
    {% block operations_content %}{% endblock %}
  </div>
</main>
{% include 'partials/footer.html' %}
{% endblock content %}
